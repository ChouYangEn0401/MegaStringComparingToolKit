[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isd-str-sdk"
dynamic = ["version"]
description = "ISD String Comparing Toolkit (Python)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "周暘恩", email = "chouyangen0401@ntu.edu.tw" },
    { name = "Anthony Chou", email = "mi.anthony.chou@gmail.com" },
]
dependencies = [
    "rapidfuzz>=3.0",
    "regex>=2023.0",
    # pandas 2.x and 3.x are both supported: the full test suite (286 tests)
    # passes under pandas 2.3.3 and 3.0.2. Cap at the next major only.
    "pandas>=2.0,<4.0",
    # Depend on the framework by VERSION RANGE, not a hard-pinned direct-URL/hash.
    # 0.4.5 -> 0.9.x is API-compatible for every name this package imports
    # (verified by signature diff). Requires the wheel to be resolvable via an
    # index or `pip install --find-links <dir-with-wheel>`.
    "isd-py-framework-sdk>=0.9,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "isd_str_sdk._version.__version__" }

[project.optional-dependencies]
# 安裝方式 pip install {project_name}[dev]
dev = [
    "pytest>=7.0",
    "black>=24.0",
]
nlp = [
    # Optional dependency for `EmbeddingSimilarityStrategy`
    "sentence-transformers>=2.2.2",
    "numpy>=1.24",
]
all = [
    "isd-str-sdk[dev]",
    "isd-str-sdk[nlp]",
]

# [project.scripts]
# Uncomment and fill in after renaming the package:
# my_tool = "my_package.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
"isd_str_sdk" = [
    "str_cleaning/strategies/pre_contexted/*.xlsx",
    "str_cleaning/strategies/pre_contexted/*.csv",
]
